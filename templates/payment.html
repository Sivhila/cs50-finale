{% extends "layout.html" %}

{% block title %}
	Payment
{% endblock %}

{% block main %}
<form action="/payment" method="post">
	<input type="hidden" name="quote_id" value="{{ quote_id }}">
	<input type="hidden" name="price" value="{{ price }}">

	<div class="mb-3">
		<label class="form-label">Payment Method:</label>
		<select id="paymentMethod" name="method" class="form-select" required>
			<option value="" selected disabled>--Select--</option>
			<option value="mobile">Mobile Money</option>
			<option value="card">Debit / Credit Card</option>
		</select>
	</div>

	<div id="mobileMoneySection" class="mb-3" style="display:none;">
		<label class="form-label">Mobile Money Provider:</label>
		<select name="provider" class="form-select">
			<option value="airtel">Airtel Money</option>
			<option value="mtn">MTN Mobile Money</option>
			<option value="zamtel">Zamtel Money</option>
		</select>

		<label class="form-label">Mobile Number:</label>
		<input type="tel" name="phone" class="form-control" placeholder="097xxxxxxx/096xxxxxxx/095xxxxxxxxx">
	</div>

	<div id="cardSection" class="mb-3" style="display:none;">
		<label class="form-label">Card Number</label>
		<input type="text" name="card_number" class="form-control">

		<div class="row">
			<div class="col">
				<label class="form-label">Expiry:</label>
				<input type="text" name="expiry" class="form-control">
			</div>

			<div class="col">
				<label class="form-label">CVV:</label>
				<input type="password" name="cvv" class="form-control">
			</div>
		</div>
	</div>

	<button class="btn btn-primary" type="submit">Make payment {{ price | ZMW }}</button>
	
</form>

{% endblock %}
