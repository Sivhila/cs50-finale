{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}


{% block main %}

<form class="login-form">
	<div class="mb-3">
		<input autocomplete="off" autofocus class="form-control mx-auto w-auto" id="email-input" name="email" placeholder="Email" type="email" required>
		<div id="email-error-message" class="error-msg"></div>
	</div>

	<div class="mb-3">
		<input autocomplete="off" class="form-control mx-auto w-auto" id="password-input" name="password" placeholder="Password" type="password" required>
		<div id="password-error-message" class="error-msg"></div>
	</div>

	<button id="sign-in-btn" type="button" class="btn btn-primary">Sign In</button>
</form>

<div class="alt-signin-divider">OR</div>

<button id="sign-in-with-google-btn" type="button" class="btn btn-google btn-lg">
	<img src="https://static.dezeen.com/uploads/2025/05/sq-google-g-logo-update_dezeen_2364_col_0.jpg" alt="Google Sign In">
	<span>Sign In with Google</span>
</button>
<div id="google-signin-error-message" class="error-msg"></div>

<button id="sign-in-with-apple-btn" type="button" class="btn btn-apple btn-lg">
	<img src="https://endlessicons.com/wp-content/uploads/2012/11/apple-icon-614x460.png" alt="Apple Sign In">
	<span>Sign In with Apple</span>
</button>
<div id="apple-signin-error-message" class="error-msg"></div>

<div class="alt-signup-divider">Do not have an account? <a href="/signup">Sign Up</a>
</div>

<div class="alt-signup-divider"><a href="/reset_password">Forgot Password?</a></div>

<script type="module" src="/static/login-auth.js"></script>
{% endblock %}
